services:
  - type: web
    name: keyloop-service-scheduler
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEMO_AUTH
        value: "true"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SEED
        value: "false"