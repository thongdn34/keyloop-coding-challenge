<style>
  .mermaid svg { max-width: 100%; height: auto; }
</style>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: "strict",
    theme: "base",
    flowchart: { htmlLabels: true, curve: "linear", nodeSpacing: 24, rankSpacing: 28 },
    themeVariables: { fontSize: "16px", fontFamily: "Segoe UI, sans-serif" }
  });
  const hosts = new Set();
  let index = 0;
  for (const node of document.querySelectorAll(".language-mermaid")) {
    const host = node.closest(".highlighter-rouge") || node.closest("pre") || node;
    if (hosts.has(host)) continue;
    hosts.add(host);
    const source = node.textContent;
    if (!source.trim()) continue;
    const { svg } = await mermaid.render("diagram-" + index++, source);
    const holder = document.createElement("div");
    holder.className = "mermaid";
    holder.innerHTML = svg;
    host.replaceWith(holder);
  }
</script>
